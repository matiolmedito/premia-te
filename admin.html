<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · premia.te</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#6c4cff;--bg:#f6f6f4;--ink:#151621;--line:#e5e5df}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{padding:20px 5%;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:white}.logo{font-size:24px;font-weight:900}.logo span{color:var(--p)}main{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:16px}.login{max-width:440px;margin:80px auto}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:7px 0 12px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:white}.danger{background:#fee9e8;color:#a52a25}.approve{background:#e7f7ed;color:#176b38}.order{display:grid;grid-template-columns:1fr auto;gap:16px}.muted{color:#747783;font-size:13px}.nums{font-weight:800;color:var(--p);margin:9px 0}.actions{display:flex;gap:8px;align-items:center}.receipt{color:var(--p);font-weight:700;text-decoration:none}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#fff4d8;font-size:11px;font-weight:800}#panel{display:none}@media(max-width:650px){.order{grid-template-columns:1fr}.actions{flex-wrap:wrap}}</style></head><body><header><div class="logo">premia<span>.te</span> <small style="font-size:12px">ADMIN</small></div><button id="logout" style="display:none" onclick="logout()">Salir</button></header><main><div id="login" class="card login"><h1>Panel administrador</h1><p class="muted">Acceso exclusivo del administrador de premia.te.</p><input class="field" id="email" type="email" value="matialeolmedo@gmail.com" readonly><input class="field" id="password" type="password" placeholder="Contraseña"><button class="primary" style="width:100%" onclick="login()">Ingresar</button><p id="msg" class="muted"></p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><p class="muted">¿Primera vez? Creá la contraseña de administrador.</p><button onclick="signup()">Crear acceso</button></div><div id="panel"><h1>Pagos y participaciones</h1><p class="muted">Validá el ingreso real en ueno antes de aprobar un comprobante.</p><div id="orders"></div></div></main><script>const URL='https://cjkejwwfubifrsakfink.supabase.co',KEY='sb_publishable_S8B-y5wlSbz0UDym2_A16g_7ETBXRFF',API=URL+'/functions/v1/admin-orders',sb=supabase.createClient(URL,KEY);async function signup(){let p=password.value;if(p.length<8){msg.textContent='Usá una contraseña de al menos 8 caracteres.';return}let {error}=await sb.auth.signUp({email:email.value,password:p});msg.textContent=error?error.message:'Acceso creado. Si Supabase te envía un correo de confirmación, confirmalo y luego ingresá.'}async function login(){let {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}show()}async function logout(){await sb.auth.signOut();location.reload()}async function show(){let {data:{session}}=await sb.auth.getSession();if(!session)return;login.style.display='none';panel.style.display='block';logout.style.display='block';load(session.access_token)}async function load(token){orders.innerHTML='<div class="card">Cargando…</div>';let r=await fetch(API,{headers:{Authorization:'Bearer '+token}}),j=await r.json();if(!j.ok){orders.innerHTML='<div class="card">'+j.error+'</div>';return}let pending=j.orders.filter(o=>o.status==='pending');orders.innerHTML=pending.length?'':'<div class="card">No hay pagos pendientes 🎉</div>';pending.forEach(o=>{let p=o.participants,n=o.raffle_numbers.map(x=>String(x.number).padStart(4,'0')).join(' · '),d=document.createElement('div');d.className='card order';d.innerHTML='<div><span class="pill">PENDIENTE</span><h3>'+o.public_code+' · Gs. '+o.total_guarani.toLocaleString('es-PY')+'</h3><div>'+p.full_name+' · CI '+p.ci+'</div><div class="muted">'+p.phone+(p.email?' · '+p.email:'')+'</div><div class="nums">'+n+'</div>'+(o.receipt_url?'<a class="receipt" href="'+o.receipt_url+'" target="_blank">Ver comprobante ↗</a>':'Sin comprobante')+'</div><div class="actions"><button class="approve" onclick="review(\''+o.id+'\',\'approve\')">✓ Aprobar</button><button class="danger" onclick="review(\''+o.id+'\',\'reject\')">Rechazar</button></div>';orders.appendChild(d)})}async function review(id,action){if(!confirm(action==='approve'?'¿Confirmás que verificaste el ingreso real del dinero?':'¿Rechazar y liberar estos números?'))return;let {data:{session}}=await sb.auth.getSession();let r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({order_id:id,action})}),j=await r.json();if(!j.ok)alert(j.error);else load(session.access_token)}show();</script></body></html>
