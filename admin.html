<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin premia.te</title><style>body{font-family:Arial,sans-serif;background:#f6f6f4;color:#151621;margin:0}header{padding:22px 5%;background:#fff;border-bottom:1px solid #ddd;font-size:24px;font-weight:800}header b{color:#6c4cff}main{max-width:1000px;margin:55px auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:28px;margin-bottom:16px}.login{max-width:440px;margin:auto}input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:11px}button{padding:13px 17px;border:0;border-radius:11px;font-weight:700;cursor:pointer}.primary{width:100%;background:#6c4cff;color:#fff}.ok{background:#e5f7eb;color:#176b38}.bad{background:#fee8e7;color:#9c2925}.muted{color:#737783;font-size:13px}.order{display:flex;justify-content:space-between;gap:15px}.nums{color:#6c4cff;font-weight:800;margin:10px 0}#panel{display:none}.actions{display:flex;gap:8px;align-items:center}@media(max-width:650px){.order{display:block}.actions{margin-top:15px}}</style></head><body><header>premia<b>.te</b> <small>ADMIN</small></header><main><div id="loginBox" class="card login"><h1>Panel administrador</h1><p class="muted">Acceso exclusivo del administrador.</p><input value="matialeolmedo@gmail.com" readonly><input id="pass" type="password" placeholder="Contraseña"><button class="primary" id="in">Ingresar</button><p id="msg" class="muted"></p><hr><p class="muted">¿Primera vez? Escribí una contraseña de mínimo 8 caracteres.</p><button id="up">Crear acceso</button></div><div id="panel"><h1>Pagos pendientes</h1><p class="muted">Aprobá únicamente después de verificar el ingreso real del dinero.</p><button id="out">Salir</button><div id="orders"></div></div></main><script>
var U='https://cjkejwwfubifrsakfink.supabase.co',K='sb_publishable_S8B-y5wlSbz0UDym2_A16g_7ETBXRFF',A=U+'/functions/v1/admin-orders',S=null;
async function auth(path,data){var r=await fetch(U+'/auth/v1/'+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(data)});var j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Error');return j}
up.onclick=async()=>{if(pass.value.length<8){msg.innerText='La contraseña debe tener al menos 8 caracteres.';return}try{var j=await auth('signup',{email:'matialeolmedo@gmail.com',password:pass.value});msg.innerText=j.access_token?'Acceso creado. Ahora tocá Ingresar.':'Acceso creado. Revisá tu correo para confirmarlo.'}catch(e){msg.innerText=e.message}};
in.onclick=async()=>{try{S=await auth('token?grant_type=password',{email:'matialeolmedo@gmail.com',password:pass.value});localStorage.setItem('pa',JSON.stringify(S));show()}catch(e){msg.innerText=e.message}};
out.onclick=()=>{localStorage.removeItem('pa');location.reload()};
async function show(){if(!S||!S.access_token)return;loginBox.style.display='none';panel.style.display='block';orders.innerHTML='<div class="card">Cargando...</div>';var r=await fetch(A,{headers:{Authorization:'Bearer '+S.access_token}}),j=await r.json();if(!j.ok){orders.innerHTML='<div class="card">'+j.error+'</div>';return}var p=j.orders.filter(x=>x.status==='pending');orders.innerHTML=p.length?'':'<div class="card">No hay pagos pendientes.</div>';p.forEach(o=>{var d=document.createElement('div'),q=o.participants,n=o.raffle_numbers.map(x=>String(x.number).padStart(4,'0')).join(' - ');d.className='card order';d.innerHTML='<div><b>'+o.public_code+' - Gs. '+o.total_guarani.toLocaleString('es-PY')+'</b><div>'+q.full_name+' - CI '+q.ci+'</div><div class="muted">'+q.phone+'</div><div class="nums">'+n+'</div>'+(o.receipt_url?'<a href="'+o.receipt_url+'" target="_blank">Ver comprobante</a>':'')+'</div><div class="actions"><button class="ok">Aprobar</button><button class="bad">Rechazar</button></div>';var bs=d.querySelectorAll('button');bs[0].onclick=()=>review(o.id,'approve');bs[1].onclick=()=>review(o.id,'reject');orders.appendChild(d)})}
async function review(id,action){if(!confirm(action==='approve'?'¿Verificaste el ingreso real del dinero?':'¿Rechazar y liberar los números?'))return;var r=await fetch(A,{method:'POST',headers:{Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},body:JSON.stringify({order_id:id,action:action})}),j=await r.json();if(j.ok)show();else alert(j.error)}
try{S=JSON.parse(localStorage.getItem('pa'))}catch(e){}show();
</script></body></html>
